<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>思い出マップ</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
</head>
<body>
  <div id="auth-loading" class="auth-panel visible">
    <div class="auth-card">
      <h2>思い出マップ</h2>
      <p id="auth-message">Googleアカウントでログインしてください。</p>
      <button id="google-login" type="button">Googleでログイン</button>
      <button id="open-login-browser" type="button" hidden>ブラウザで開く</button>
      <button id="copy-login-url" type="button" hidden>ログインURLをコピー</button>
      <p id="auth-error" class="auth-error" role="alert"></p>
    </div>
  </div>

  <header>
    <h1>思い出マップ</h1>
    <button id="google-logout" class="logout-button" type="button">ログアウト</button>
    <form id="address-search">
      <input
        id="address-input"
        type="search"
        placeholder="住所や店名を入力"
        aria-label="住所や店名"
        required
      >
      <button type="submit">検索して追加</button>
    </form>
    <div id="search-candidates" aria-live="polite"></div>
  </header>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>
  <script src="./search-config.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./app.js"></script>
  <script type="module" src="./firebase-auth.js?v=202611010056"></script>
</body>
</html>
